<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Acada</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#e1e8ff",

                    "tertiary-container": "#dfd5f7",
                    "on-secondary": "#faf8fc",
                    "inverse-on-surface": "#969db0",
                    "tertiary-fixed": "#dfd5f7",
                    "surface-container-low": "#f1f3ff",
                    "secondary": "#5f5f62",
                    "on-background": "#19315d",
                    "on-secondary-fixed-variant": "#5b5b5f",
                    "on-error-container": "#752121",
                    "inverse-surface": "#070e1d",
                    "on-tertiary-fixed": "#3c3650",
                    "surface-bright": "#f9f9ff",
                    "on-error": "#fff7f6",
                    "surface-dim": "#ccdaff",
                    "on-surface": "#19315d",
                    "on-tertiary": "#fdf7ff",
                    "inverse-primary": "#618bff",
                    "error": "#9f403d",
                    "tertiary-dim": "#564f6b",
                    "secondary-fixed": "#e4e2e6",
                    "secondary-dim": "#535356",
                    "primary-fixed-dim": "#c7d3ff",
                    "primary": "#0053db",
                    "secondary-fixed-dim": "#d5d3d8",
                    "outline-variant": "#9bb2e5",
                    "on-tertiary-container": "#4f4964",
                    "on-primary-fixed": "#003798",
                    "on-secondary-fixed": "#3f3f43",
                    "tertiary-fixed-dim": "#d0c7e8",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-highest": "#d8e2ff",
                    "primary-dim": "#0048c1",
                    "outline": "#647aab",
                    "surface-tint": "#0053db",
                    "on-surface-variant": "#485f8d",
                    "primary-container": "#dbe1ff",
                    "surface": "#f9f9ff",
                    "secondary-container": "#e4e2e6",
                    "surface-variant": "#d8e2ff",
                    "on-primary-fixed-variant": "#0050d4",
                    "on-primary-container": "#0048bf",
                    "error-dim": "#4e0309",
                    "surface-container": "#e9edff",
                    "primary-fixed": "#dbe1ff",
                    "on-tertiary-fixed-variant": "#59526e"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",

                    "headline": ["Manrope"],
                    "body": ["Manrope"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface flex min-h-screen items-center justify-center p-4">
<!-- Auth Shell Suppression: No TopAppBar or BottomNavBar as this is a focused transactional screen -->
<main class="w-full max-w-md">
<!-- Brand Identity Section -->
<div class="mb-10 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 bg-primary-container rounded-xl mb-6">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="school">school</span>
</div>
<h1 class="font-headline font-extrabold text-4xl tracking-tighter text-inverse-surface mb-2">Acada</h1>
<p class="text-on-surface-variant font-medium">Curation for the modern learner.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_16px_32px_-4px_rgba(7,14,29,0.04)]">
<form action="#" class="space-y-6" method="POST">
<!-- Input Group: Email -->
<div class="space-y-2">
<label class="font-label text-sm font-bold uppercase tracking-wider text-on-surface-variant ml-1" for="email">
                        Email Address
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="alternate_email">alternate_email</span>
</div>
<input class="block w-full pl-11 pr-4 py-4 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-highest transition-all duration-200 font-body" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label text-sm font-bold uppercase tracking-wider text-on-surface-variant" for="password">
                            Password
                        </label>
<a class="font-label text-xs font-bold text-primary hover:text-primary-dim transition-colors uppercase tracking-widest" href="#">
                            Forgot Password?
                        </a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-11 pr-4 py-4 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-highest transition-all duration-200 font-body" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-gradient-to-br from-primary to-primary-dim text-on-primary font-headline font-bold py-4 px-6 rounded-xl shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2" type="submit">
                    Log In
                    <span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full h-px bg-surface-container-high"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-widest font-label font-bold">
<span class="bg-surface-container-lowest px-4 text-outline">or continue with</span>
</div>
</div>
<!-- Social Sign-in -->
<button class="w-full flex items-center justify-center gap-3 bg-surface-container-low hover:bg-surface-container-high text-on-surface font-headline font-bold py-4 px-6 rounded-xl transition-all duration-200 group" type="button">
<svg class="w-5 h-5 group-hover:scale-110 transition-transform duration-200" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
</div>
<!-- Secondary Navigation -->
<p class="mt-8 text-center text-on-surface-variant font-medium">
            Don't have an account? 
            <a class="text-primary font-bold hover:underline" href="#">Sign up for free</a>
</p>
</main>
<!-- Background Decorative Elements -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-tertiary/5 rounded-full blur-[120px]"></div>
</div>
</body></html>
