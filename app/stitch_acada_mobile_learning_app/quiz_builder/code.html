<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Acada - Quiz Builder</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space_Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#5f5f62",
                        "secondary-fixed-dim": "#d5d3d8",
                        "tertiary-container": "#dfd5f7",
                        "inverse-on-surface": "#969db0",
                        "secondary-fixed": "#e4e2e6",
                        "background": "#f9f9ff",
                        "on-secondary": "#faf8fc",
                        "on-primary-fixed": "#003798",
                        "surface": "#f9f9ff",
                        "inverse-surface": "#070e1d",
                        "tertiary-fixed": "#dfd5f7",
                        "on-error": "#fff7f6",
                        "surface-variant": "#d8e2ff",
                        "surface-container": "#e9edff",
                        "surface-bright": "#f9f9ff",
                        "surface-dim": "#ccdaff",
                        "on-background": "#19315d",
                        "surface-tint": "#0053db",
                        "outline": "#647aab",
                        "tertiary-fixed-dim": "#d0c7e8",
                        "error": "#9f403d",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#485f8d",
                        "surface-container-highest": "#d8e2ff",
                        "on-tertiary-fixed-variant": "#59526e",
                        "on-tertiary-fixed": "#3c3650",
                        "surface-container-low": "#f1f3ff",
                        "on-primary-container": "#0048bf",
                        "on-surface": "#19315d",
                        "outline-variant": "#9bb2e5",
                        "error-dim": "#4e0309",
                        "tertiary-dim": "#564f6b",
                        "primary-dim": "#0048c1",
                        "error-container": "#fe8983",
                        "primary-fixed": "#dbe1ff",
                        "primary": "#0053db",
                        "on-tertiary": "#fdf7ff",
                        "surface-container-high": "#e1e8ff",
                        "on-secondary-fixed-variant": "#5b5b5f",
                        "on-primary": "#f8f7ff",
                        "on-secondary-fixed": "#3f3f43",
                        "inverse-primary": "#618bff",
                        "tertiary": "#625b77",
                        "on-tertiary-container": "#4f4964",
                        "primary-fixed-dim": "#c7d3ff",
                        "on-primary-fixed-variant": "#0050d4",
                        "on-secondary-container": "#515155",
                        "secondary-container": "#e4e2e6",
                        "on-error-container": "#752121",
                        "secondary-dim": "#535356",
                        "primary-container": "#dbe1ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Manrope"],
                        "label": ["Space_Grotesk"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #f9f9ff;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/60 dark:bg-slate-950/60 backdrop-blur-xl shadow-[0_16px_32px_-12px_rgba(7,14,29,0.04)]">
<div class="flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-slate-100/50 transition-colors active:scale-95 duration-200 rounded-full">
<span class="material-symbols-outlined text-blue-600">menu</span>
</button>
<h1 class="text-xl font-extrabold tracking-tighter text-blue-600 font-['Manrope']">Acada</h1>
</div>
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-slate-100/50 transition-colors active:scale-95 duration-200 rounded-full">
<span class="material-symbols-outlined text-slate-500">search</span>
</button>
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden">
<img alt="User profile avatar" class="w-full h-full object-cover" data-alt="Professional male portrait with neutral background, soft studio lighting, corporate style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1um3jGRFJgBbewqZsvZDT0lyTCv0tXoBo58jA5BYe_eUAHsI1YM9UZ9kGV3e-O4wvD2NsRzPW2XAiRRvCj77CfbLcQRnBmjGWigJ4g0om7HTyahanVROU7VSiiKI_9XxgpaZMqEwvFoD5IrVc53dU_OdAwOMaGnwvjMKKnqwAzLVviLICRfSSC3I8H9DgBYTJgC-VAzXD57sbyy2t9b4mA-fdxsYL8UZg3W5Amq7dJbA7_p_DQj8RBGXUcFFnbH_r2rjyOq-Gaw"/>
</div>
</div>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-2xl mx-auto">
<!-- Header Section -->
<div class="mb-10">
<span class="font-['Space_Grotesk'] text-[12px] uppercase tracking-widest font-bold text-primary mb-2 block">Tutor Dashboard</span>
<h2 class="text-4xl font-extrabold tracking-tight text-on-surface font-['Manrope'] mb-2">Create New Quiz</h2>
<p class="text-on-surface-variant text-lg">Define your assessment parameters below.</p>
</div>
<!-- Quiz Builder Form -->
<div class="space-y-10">
<!-- Basic Information Group -->
<section class="space-y-6">
<div class="space-y-1">
<label class="font-['Space_Grotesk'] text-xs font-bold text-on-surface-variant uppercase tracking-wider px-1">Quiz Title</label>
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-4 text-on-surface placeholder:text-outline-variant focus:ring-0 focus:bg-surface-container-highest transition-all duration-200" placeholder="e.g. Advanced Macroeconomics Final" type="text"/>
</div>
<div class="space-y-1">
<label class="font-['Space_Grotesk'] text-xs font-bold text-on-surface-variant uppercase tracking-wider px-1">Description</label>
<textarea class="w-full bg-surface-container-low border-none rounded-xl px-4 py-4 text-on-surface placeholder:text-outline-variant focus:ring-0 focus:bg-surface-container-highest transition-all duration-200 resize-none" placeholder="Describe the topics covered in this quiz..." rows="4"></textarea>
</div>
</section>
<!-- Configuration Bento Grid -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Time Limit -->
<div class="bg-surface-container-low p-6 rounded-xl space-y-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">timer</span>
<label class="font-['Space_Grotesk'] text-xs font-bold text-on-surface uppercase tracking-wider">Time Limit</label>
</div>
<div class="flex items-center bg-surface-container-lowest rounded-lg p-1">
<input class="w-full bg-transparent border-none text-center font-bold text-2xl text-on-surface focus:ring-0" type="number" value="45"/>
<span class="pr-4 font-['Space_Grotesk'] text-sm text-outline font-bold">MINS</span>
</div>
</div>
<!-- Number of Attempts -->
<div class="bg-surface-container-low p-6 rounded-xl space-y-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">refresh</span>
<label class="font-['Space_Grotesk'] text-xs font-bold text-on-surface uppercase tracking-wider">Max Attempts</label>
</div>
<select class="w-full bg-surface-container-lowest border-none rounded-lg py-3 px-4 font-['Space_Grotesk'] font-bold text-on-surface focus:ring-0">
<option>1 Attempt</option>
<option>2 Attempts</option>
<option selected="">3 Attempts</option>
<option>Unlimited</option>
</select>
</div>
<!-- Passing Score Full Width -->
<div class="bg-surface-container-low p-6 rounded-xl md:col-span-2 space-y-6">
<div class="flex justify-between items-center">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">verified</span>
<label class="font-['Space_Grotesk'] text-xs font-bold text-on-surface uppercase tracking-wider">Passing Score</label>
</div>
<span class="font-['Space_Grotesk'] text-xl font-bold text-primary">75%</span>
</div>
<div class="relative w-full h-2 bg-surface-container-highest rounded-full flex items-center">
<div class="absolute h-full bg-primary rounded-full" style="width: 75%;"></div>
<div class="absolute w-6 h-6 bg-primary border-4 border-surface-container-lowest rounded-full shadow-lg" style="left: 75%; transform: translateX(-50%);"></div>
</div>
<div class="flex justify-between font-['Space_Grotesk'] text-[10px] text-outline font-bold uppercase tracking-tighter">
<span>Min: 40%</span>
<span>Avg: 70%</span>
<span>Expert: 90%</span>
</div>
</div>
</section>
<!-- Metadata Pills -->
<section class="flex flex-wrap gap-3 py-4">
<button class="px-4 py-2 rounded-full bg-inverse-surface text-inverse-on-surface font-['Space_Grotesk'] text-xs font-bold flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">label</span>
                    ECONOMICS
                </button>
<button class="px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-['Space_Grotesk'] text-xs font-bold flex items-center gap-2 hover:bg-surface-container-highest transition-all">
<span class="material-symbols-outlined text-[16px]">add</span>
                    ADD TAG
                </button>
</section>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-surface via-surface/90 to-transparent pointer-events-none">
<div class="max-w-2xl mx-auto pointer-events-auto">
<button class="w-full bg-gradient-to-r from-primary to-primary-dim text-on-primary py-5 rounded-xl font-bold text-lg shadow-[0_16px_32px_-8px_rgba(0,83,219,0.3)] active:scale-95 transition-all duration-200 flex items-center justify-center gap-3">
<span class="material-symbols-outlined">add_circle</span>
                Add Questions
            </button>
</div>
</div>
<!-- BottomNavBar (Filtered for context) -->
<!-- Suppressed due to focused "Transactional/Task" intent of creating a quiz -->
</body></html>
