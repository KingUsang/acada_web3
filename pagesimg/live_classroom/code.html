<body class="overflow-hidden flex flex-col items-center justify-center min-h-screen">
<!-- Mobile Screen Wrapper (375px) -->

<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-white" data-icon="menu">menu</span>
<span class="text-2xl font-black tracking-tighter text-blue-500 font-headline">ACADA</span>
</div>
<div class="flex items-center gap-4">
<div class="bg-error px-2 py-0.5 rounded-lg flex items-center gap-1.5">
<span class="w-2 h-2 bg-white rounded-full animate-pulse"></span>
<span class="text-[10px] font-label font-bold text-white uppercase tracking-widest">LIVE</span>
</div>
<span class="material-symbols-outlined text-white" data-icon="notifications">notifications</span>
</div>
</header>
<!-- Main Video Area (Teacher) -->
<div class="absolute inset-0 z-0">
<img alt="Teacher" class="w-full h-full object-cover" data-alt="A professional female educator speaking passionately in a modern minimalist studio setting with soft warm key lighting and book-filled shelves." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDui4B07NXZXASUoOjiRBaXgVC25QvCzMLor88Q_EFCd2CFVbr-ODh37uN0eGx8ZxeaR3QBksjWCz4C3z6OVbhvvI4k5O1qvdxDf0HlG6FID5WoT-4EP_nmUx8V4EGQGlx9bldUf24TxYLUmvOpo5tM1JXO6UTLF32dcO82p3GYrQstfDufkjDmRLbsWQX3Q-oHVYwSEnepluEXBD5YNbhzu4oFwKJR6InZCseDb579xTD7WzQzSTrzqX1Afs7_MrG5iQm7rT8_0g"/>

<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface via-transparent to-inverse-surface/40"></div>
</div>
<!-- Student Picture-in-Picture / Slides -->
<div class="absolute top-20 right-4 w-32 aspect-[3/4] z-20 rounded-xl overflow-hidden shadow-2xl border border-white/10">

<div class="absolute bottom-2 left-2 bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded text-[8px] font-label text-white uppercase tracking-wider">
                Slides
            </div>
</div>
<!-- Class Info Badge -->
<div class="absolute top-20 left-4 z-20 flex flex-col gap-1">
<h1 class="text-white font-bold text-lg leading-tight drop-shadow-md">Advanced Web3 UI Architecture</h1>
<p class="text-white/70 text-xs font-label uppercase tracking-widest">Module 4: Semantic Layers</p>
</div>
<!-- Floating Controls Bar (Bottom) -->

<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 text-white hover:bg-white/20 transition-all active:scale-90">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 text-white hover:bg-white/20 transition-all active:scale-90">
<span class="material-symbols-outlined" data-icon="videocam">videocam</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-blue-600 text-white shadow-lg shadow-blue-600/20 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="present_to_all">present_to_all</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-white/10 text-white hover:bg-white/20 transition-all active:scale-90">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
<button class="w-12 h-10 flex items-center justify-center rounded-full bg-error text-white shadow-lg shadow-error/20 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="call_end">call_end</span>
</button>
</div>
<!-- Sliding Chat Drawer (Minimized State - Tab) -->
<div class="absolute bottom-4 left-0 w-full px-4 z-40">
<div class="w-full bg-white/90 backdrop-blur-2xl rounded-t-3xl rounded-b-xl overflow-hidden shadow-2xl flex flex-col max-h-[300px]">
<!-- Header -->
<div class="flex items-center justify-between px-6 py-3 border-b border-black/5">
<div class="flex items-center gap-2">
<span class="text-[10px] font-label font-bold text-blue-600 uppercase tracking-widest">Live Chat</span>
<span class="w-1.5 h-1.5 bg-blue-600 rounded-full"></span>
</div>
<span class="material-symbols-outlined text-slate-400 text-lg" data-icon="keyboard_arrow_up">keyboard_arrow_up</span>
</div>

</div>
<div class="flex flex-col">
<span class="text-[10px] font-label font-bold text-slate-500">MARCUS VANE</span>
<p class="text-xs text-on-surface leading-snug">Could you elaborate more on the 'No-Line' rule in dark mode contexts?</p>
</div>
</div>
<!-- Quick Input -->
<div class="px-4 pb-4">
<div class="flex items-center bg-surface-container-low rounded-full px-4 py-2">
<input class="bg-transparent border-none focus:ring-0 text-xs flex-grow font-body text-on-surface" placeholder="Type a message..." type="text"/>
<span class="material-symbols-outlined text-blue-600 text-lg" data-icon="send">send</span>
</div>
</div>
</div>
</div>
<!-- Visual Elements for Depth (Grayscale accents) -->
<div class="absolute top-40 left-0 w-1 h-24 bg-blue-600/40 rounded-r-full blur-[1px]"></div>
</main>
<!-- Bottom Nav Bar Simulation (Suppressed as per rules for task-focused classroom mode, but visible in ghosted background for context if needed - though the rules say suppress it for focused journeys) -->
<!-- We keep the nav suppressed to focus on the Live Class experience. -->
