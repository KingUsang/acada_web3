<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Manrope', sans-serif;
    }
    .technical-label {
      font-family: 'Space Grotesk', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #d8e2ff;
      border-radius: 10px;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-24">
<!-- Top Navigation (Conditional Shell - Hidden as Task-Focused Journey) -->
<header class="w-full sticky top-0 z-50 bg-[#f9f9ff] dark:bg-[#070e1d] flex justify-between items-center px-6 py-4 max-w-full">
<div class="flex items-center gap-3">
<button class="hover:bg-blue-50 transition-colors p-2 rounded-full active:scale-95 duration-150 text-slate-500">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Manrope'] font-bold tracking-tight text-lg text-blue-600">Add Question</h1>
</div>
<div class="flex items-center gap-4">
<div class="technical-label text-[10px] uppercase tracking-widest text-slate-500 px-3 py-1 bg-surface-container-low rounded-full">Step 3 of 5</div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden border-2 border-white shadow-sm">
<img class="w-full h-full object-cover" data-alt="professional male educator avatar with friendly expression in clean modern studio lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD0KO1IGo9phPrymsROaTQ_nSJYrn0I7eIn6IAiBmKiV8HYh1NhdDb2N0nKvCW41Pshf_Lg0Z10Jaxy4JClCtloqSd7E8O2IiNCMHlBk0188Hbh70LDBZDMqVvkGu5IQl7Bxbet62tlwcbpzGvBJgm1yaNwo2PmwUqtKLSIJurC95yX69TLwPrf5dBmyaANhtvFBi3zS1EeYqu5dG7LmxpC7HokNPRG6rHgkP-6d8v4WoIkF-zoFfEySs59O-wbpyjWED1OkUGYeA"/>
</div>
</div>
</header>
<main class="max-w-2xl mx-auto px-6 py-8">
<div class="space-y-8">
<!-- Editorial Section Header -->
<section>
<h2 class="text-3xl font-extrabold tracking-tighter text-on-surface mb-2">Compose Your Question</h2>
<p class="text-on-surface-variant font-medium opacity-80 leading-relaxed">Define the prompt and potential answers for your students. Precision is the key to effective assessment.</p>
</section>
<!-- Input Section: Question Text -->
<section class="space-y-4">
<div class="flex items-center justify-between">
<label class="technical-label text-xs font-bold uppercase tracking-widest text-primary">Question Prompt</label>
<span class="technical-label text-[10px] text-on-surface-variant">0/500 characters</span>
</div>
<div class="relative group">
<textarea class="w-full bg-surface-container-low border-none rounded-xl p-5 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-highest transition-all outline-none text-lg font-semibold placeholder:text-on-surface-variant/40 placeholder:font-normal custom-scrollbar" placeholder="Enter the core question here..." rows="4"></textarea>
<div class="absolute bottom-4 right-4 flex gap-2">
<button class="p-2 bg-surface-container-lowest rounded-lg text-on-surface-variant hover:text-primary transition-colors active:scale-90">
<span class="material-symbols-outlined text-[20px]">image</span>
</button>
<button class="p-2 bg-surface-container-lowest rounded-lg text-on-surface-variant hover:text-primary transition-colors active:scale-90">
<span class="material-symbols-outlined text-[20px]">functions</span>
</button>
</div>
</div>
</section>
<!-- Answer Options Section -->
<section class="space-y-4">
<div class="flex items-center justify-between mb-4">
<label class="technical-label text-xs font-bold uppercase tracking-widest text-primary">Answer Options</label>
<span class="technical-label text-[10px] text-on-surface-variant">Select the correct one</span>
</div>
<!-- Bento Style Answer Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Option A -->
<div class="relative group">
<div class="absolute left-4 top-1/2 -translate-y-1/2 technical-label font-bold text-primary opacity-50 group-focus-within:opacity-100">A</div>
<input class="w-full pl-10 pr-12 py-5 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-highest transition-all outline-none font-medium placeholder:text-on-surface-variant/40" placeholder="Option A" type="text"/>
<label class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer">
<input class="hidden peer" name="correct_answer" type="radio"/>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-white hidden peer-checked:block">check</span>
</div>
</label>
</div>
<!-- Option B -->
<div class="relative group">
<div class="absolute left-4 top-1/2 -translate-y-1/2 technical-label font-bold text-primary opacity-50 group-focus-within:opacity-100">B</div>
<input class="w-full pl-10 pr-12 py-5 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-highest transition-all outline-none font-medium placeholder:text-on-surface-variant/40" placeholder="Option B" type="text"/>
<label class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer">
<input class="hidden peer" name="correct_answer" type="radio"/>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-white hidden peer-checked:block">check</span>
</div>
</label>
</div>
<!-- Option C -->
<div class="relative group">
<div class="absolute left-4 top-1/2 -translate-y-1/2 technical-label font-bold text-primary opacity-50 group-focus-within:opacity-100">C</div>
<input class="w-full pl-10 pr-12 py-5 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-highest transition-all outline-none font-medium placeholder:text-on-surface-variant/40" placeholder="Option C" type="text"/>
<label class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer">
<input class="hidden peer" name="correct_answer" type="radio"/>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-white hidden peer-checked:block">check</span>
</div>
</label>
</div>
<!-- Option D -->
<div class="relative group">
<div class="absolute left-4 top-1/2 -translate-y-1/2 technical-label font-bold text-primary opacity-50 group-focus-within:opacity-100">D</div>
<input class="w-full pl-10 pr-12 py-5 bg-surface-container-low border-none rounded-xl focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-highest transition-all outline-none font-medium placeholder:text-on-surface-variant/40" placeholder="Option D" type="text"/>
<label class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer">
<input class="hidden peer" name="correct_answer" type="radio"/>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-white hidden peer-checked:block">check</span>
</div>
</label>
</div>
</div>
</section>
<!-- Advanced Settings Section -->
<section class="bg-surface-container-low p-6 rounded-xl space-y-6">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">psychology</span>
<div>
<h4 class="font-bold text-sm">Explanation (Optional)</h4>
<p class="text-xs text-on-surface-variant">Shown after the student answers.</p>
</div>
</div>
<button class="text-primary hover:text-primary-dim transition-colors">
<span class="material-symbols-outlined">expand_more</span>
</button>
</div>
</section>
</div>
</main>
<!-- Sticky Bottom CTA (Primary Button) -->
<div class="fixed bottom-0 left-0 right-0 p-6 bg-white/80 backdrop-blur-xl border-t border-surface-container-high z-50">
<div class="max-w-2xl mx-auto flex items-center gap-4">
<button class="flex-1 bg-gradient-to-br from-primary to-primary-dim text-white font-bold py-5 rounded-xl shadow-[0_8px_20px_rgba(37,99,235,0.2)] active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
<span>Add to Quiz</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<button class="p-5 bg-surface-container-high text-on-surface rounded-xl hover:bg-surface-container-highest transition-colors active:scale-95">
<span class="material-symbols-outlined">delete_outline</span>
</button>
</div>
</div>
<!-- Bottom Navigation (Conditional Suppressed based on Task-Focus Journey) -->
<!-- Navigation suppressed to prioritize focusing on the builder content canvas -->
</body></html>
